info:
  name: Get Payer by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/payers/{{payerId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves a single payer record using the `payerId` variable. Run the 'Create Payer' request first to set this variable.
