info:
  name: Get current user details
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/me?x-client-api-key=default"
  params:
    - name: x-client-api-key
      value: default
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves the details of the currently authenticated user.
