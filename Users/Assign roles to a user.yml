info:
  name: Assign roles to a user
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/users/:id/roles"
  headers:
    - name: x-client-api-key
      value: default
  params:
    - name: id
      value: "1"
      type: path
      description: (Required) The ID of the user to assign roles to.
  body:
    type: json
    data: |-
      {
        "roleIds": [
          1,
          2
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Assigns one or more roles to a specific user.
