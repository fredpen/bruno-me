info:
  name: Get user Preview
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/users/:id"
  headers:
    - name: x-client-api-key
      value: default
  params:
    - name: id
      value: "1"
      type: path
      description: (Required) The ID of the user to retrieve.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves the details of a specific user by their ID.
