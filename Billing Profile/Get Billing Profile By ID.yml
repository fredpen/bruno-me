info:
  name: Get Billing Profile By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/billing-profiles/{{billingProfileId}}"
  headers:
    - name: x-client-api-key
      value: default
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves a single billing profile using its UUID.
