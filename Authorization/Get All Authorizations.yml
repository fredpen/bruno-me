info:
  name: Get All Authorizations
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/authorizations?sortOrder=asc&sortField=clientLastName"
  headers:
    - name: x-client-api-key
      value: default
  params:
    - name: clientFirstName
      value: ""
      type: query
      disabled: true
    - name: clientLastName
      value: ""
      type: query
      disabled: true
    - name: clientIdentifier
      value: ""
      type: query
      disabled: true
    - name: clientPayerId
      value: ""
      type: query
      disabled: true
    - name: supervisor
      value: ""
      type: query
      disabled: true
    - name: primaryPayer
      value: ""
      type: query
      disabled: true
    - name: program
      value: ""
      type: query
      disabled: true
    - name: page
      value: ""
      type: query
      disabled: true
    - name: sortOrder
      value: asc
      type: query
    - name: sortField
      value: clientLastName
      type: query
    - name: keyword
      value: zaylen
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
