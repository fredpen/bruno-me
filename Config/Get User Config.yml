info:
  name: Get User Config
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/config"
  headers:
    - name: x-client-api-key
      value: "{{x-client-api-key}}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
