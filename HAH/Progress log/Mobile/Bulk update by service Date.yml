info:
  name: Bulk update by service Date
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/client/habilitation/progress/bulk/mobile"
  headers:
    - name: x-client-api-key
      value: default
  body:
    type: json
    data: |-
      {
          "serviceDate": "2025-01-11",
          "goals": [
              {
                  "goalId": "{{goalId}}",
                  "notes": "{{$randomLoremSentences}}",
                  "score": 2
              },
              {
                  "goalId": "{{goalId2}}",
                  "notes": "{{$randomLoremSentences}}",
                  "score": 3
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

