info:
  name: Get Xref
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/xref/{{xrefId}}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves a single XRef record using the `xrefId` variable set by the 'Create' request. If you haven't run the 'Create' request yet, this will fail or use a stale ID.
