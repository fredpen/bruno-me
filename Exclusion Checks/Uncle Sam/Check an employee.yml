info:
  name: Check an employee
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/employees/exclusion-checks/sam-gov/manual-search/screenshot?firstName=ajayi&lastName=taiwo"
  headers:
    - name: x-client-api-key
      value: default
  params:
    - name: firstName
      value: ajayi
      type: query
    - name: lastName
      value: taiwo
      type: query
  body:
    type: json
    data: |-
      {
          "isMobileUser": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
