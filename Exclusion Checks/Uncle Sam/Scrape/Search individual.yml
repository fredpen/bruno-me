runtime:
  scripts:
    - type: before-request
      code: |-
        // Read the existing query param
        const nameParam = req.getUrl().query.get('excluded_party_ssn');

        if (!nameParam) {
          // JSON encode + URL encode
          const encoded = encodeURIComponent(JSON.stringify(nameParam));

          // Remove original
          req.getUrl().query.remove('excluded_party_ssn');

          // Add encoded version back
          req.getUrl().query.add({
            key: 'excluded_party_ssn',
            value: encoded,
          });
        }

