info:
  name: Reset ISA
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/billing/reset-isa"
  headers:
    - name: x-client-api-key
      value: default
  body:
    type: json
    data: |-
      {
          "isaValue": 17
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
