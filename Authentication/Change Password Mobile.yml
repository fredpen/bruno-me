info:
  name: Change Password Mobile
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/auth/change-password/mobile"
  headers:
    - name: x-idempotency-key
      value: default
    - name: x-client-api-key
      value: default
  body:
    type: json
    data: |-
      {
        "old_password": "Password@123R",
        "new_password": "Password@123RR"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
