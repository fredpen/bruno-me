  url: "{{baseUrl}}/auth/login"
  headers:
    - name: x-idempotency-key
      value: default
    - name: x-client-api-key
      value: default
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "agencyId": "{{agencyId}}",
          "email": "{{email}}",
          "password": "{{password}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

