info:
  name: Assign Device
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/push-tokens/assign-device"
  headers:
    - name: x-client-api-key
      value: default
  body:
    type: json
    data: |-
      {
          "deviceId": "somerandom-device-id"
      }
  auth:
    type: bearer
    token: "{{mobileToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
