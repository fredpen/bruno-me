info:
  name: My registered Devices
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/push-tokens/devices"
  headers:
    - name: x-client-api-key
      value: default
  auth:
    type: bearer
    token: "{{mobileToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
